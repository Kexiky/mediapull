services:
  web:
    build: .
    container_name: mediapull-web
    restart: unless-stopped
    # Файлы в ./data и ./downloads принадлежат пользователю контейнера (uid 1000).
    # Если ваш пользователь на хосте другой: user: "${UID}:${GID}" и chown -R на эти папки.
    command: ["python", "run.py", "--host", "0.0.0.0", "--port", "8000", "--no-reload"]
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=false
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build: .
    container_name: mediapull-bot
    restart: unless-stopped
    command: ["python", "-u", "run_bot.py"]
    env_file:
      - .env
    # Webhook-режим (TELEGRAM_WEBHOOK_URL): порт слушает бот, проксируйте на него HTTPS-запросы Telegram.
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    healthcheck:
      # бот каждые 30 с обновляет файл-пульс; если цикл событий завис — контейнер станет unhealthy
      test: ["CMD", "python", "-c", "import os,sys,tempfile,time;p=os.path.join(tempfile.gettempdir(),'mediapull-bot.alive');sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<120 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      web:
        condition: service_healthy

  # Локальный Bot API сервер: снимает лимит 50 МБ (загрузка до 2 ГБ).
  # Запуск:  docker compose --profile local-api up -d
  # В .env:  TELEGRAM_API_ID, TELEGRAM_API_HASH (https://my.telegram.org) и TELEGRAM_API_SERVER=http://telegram-bot-api:8081
  # Один раз перед переключением выполните logOut у облачного API:  https://api.telegram.org/bot<TOKEN>/logOut
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: mediapull-telegram-api
    profiles: ["local-api"]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telegram-bot-api-data:
